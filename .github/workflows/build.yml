name: Build sandbox images

on:
  pull_request:
    paths:
      - 'golang/**'
      - 'node/**'
      - '.github/workflows/**'
  push:
    branches:
      - master
    paths:
      - 'golang/**'
      - 'node/**'
      - '.github/workflows/**'

jobs:
  # ---------------------------------------------------------------- hadolint
  hadolint:
    name: Lint Dockerfile (hadolint) (${{ matrix.dir }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dir: [golang, node]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ${{ matrix.dir }}/Dockerfile
          failure-threshold: error

  # ------------------------------------------------------------------- build
  build:
    name: Build & push image (${{ matrix.dir }})
    needs: hadolint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { dir: golang, version_arg: GOLANG_VERSION }
          - { dir: node,  version_arg: NODE_VERSION }
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The runtime version is extracted from the Dockerfile's version ARG
      # (GOLANG_VERSION / NODE_VERSION), so it is never hardcoded in CI.
      - name: Extract version from Dockerfile
        id: version
        run: |
          VERSION="$(grep -oP "${{ matrix.version_arg }}=\K[0-9.]+" "${{ matrix.dir }}/Dockerfile" | head -n1)"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set image tags
        id: tags
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          IMAGE="ghcr.io/teran/sandbox-containers/${{ matrix.dir }}"
          SHORT_SHA="${GITHUB_SHA::7}"
          if [ "${{ github.event_name }}" = "push" ]; then
            TIMESTAMP="$(date -u +%Y%m%d%H%M%S)"
            TAGS="${IMAGE}:${VERSION},${IMAGE}:${VERSION}-${SHORT_SHA},${IMAGE}:${VERSION}-${SHORT_SHA}-${TIMESTAMP}"
          else
            TAGS="${IMAGE}:${VERSION}"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}"
          echo "tags=${TAGS}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.dir }}
          file: ${{ matrix.dir }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.tags.outputs.tags }}
