name: Build sandbox images

on:
  pull_request:
    paths:
      - 'golang/**'
      - '.github/workflows/**'
  push:
    branches:
      - master
    paths:
      - 'golang/**'
      - '.github/workflows/**'

env:
  IMAGE: ghcr.io/teran/sandbox-containers/golang

jobs:
  # ---------------------------------------------------------------- hadolint
  hadolint:
    name: Lint Dockerfile (hadolint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: golang/Dockerfile
          failure-threshold: error

  # ------------------------------------------------------------------- build
  build:
    name: Build & push image
    needs: hadolint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Go version from Dockerfile
        id: version
        run: |
          GO_VERSION="$(grep -oP 'GOLANG_VERSION=\K[0-9.]+' golang/Dockerfile | head -n1)"
          echo "go_version=${GO_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set image tags
        id: tags
        run: |
          VERSION="${{ steps.version.outputs.go_version }}"
          SHORT_SHA="${GITHUB_SHA::7}"
          if [ "${{ github.event_name }}" = "push" ]; then
            TIMESTAMP="$(date -u +%Y%m%d%H%M%S)"
            TAGS="${IMAGE}:${VERSION},${IMAGE}:${VERSION}-${SHORT_SHA},${IMAGE}:${VERSION}-${SHORT_SHA}-${TIMESTAMP}"
          else
            TAGS="${IMAGE}:${VERSION}"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "go_version=${VERSION}"
          echo "tags=${TAGS}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./golang
          file: golang/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.tags.outputs.tags }}
